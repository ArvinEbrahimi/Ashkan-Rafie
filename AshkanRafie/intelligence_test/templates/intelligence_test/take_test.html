{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون</title>
</head>
<style>
    body {
        font-family: 'Vazirmatn', sans-serif;
        direction: rtl;
        background-color: #121212;
        /* رنگ پس‌زمینه تاریک */
        color: #ffffff;
        /* رنگ متن سفید */
        font-family: Arial, sans-serif;
        /* فونت */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        /* ارتفاع صفحه */
        margin: 0;
        /* حذف حاشیه */
    }

    .quiz-container {
        background-color: #1e1e1e;
        /* رنگ پس‌زمینه کارت */
        border-radius: 10px;
        /* گوشه‌های گرد */
        padding: 20px;
        /* فاصله داخلی */
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        /* سایه */
        width: 500px;
        /* عرض کارت */
        text-align: center;
        /* تراز متن */
    }

    .question {
        font-size: 20px;
        /* اندازه فونت سوال */
        margin-bottom: 20px;
        /* فاصله بین سوال و گزینه‌ها */
    }

    .option {
        background-color: #3a3a3a;
        /* رنگ پس‌زمینه گزینه */
        border: none;
        /* حذف حاشیه */
        color: #ffffff;
        /* رنگ متن گزینه */
        padding: 10px;
        /* فاصله داخلی */
        margin: 5px 0;
        /* فاصله بین گزینه‌ها */
        border-radius: 5px;
        /* گوشه‌های گرد */
        cursor: pointer;
        /* نشانگر ماوس */
        transition: background-color 0.3s;
        /* انیمیشن تغییر رنگ */
    }

    .option:hover {
        background-color: #575757;
        /* رنگ پس‌زمینه هنگام هاور */
    }

    .submit-btn {
        background-color: #4CAF50;
        /* رنگ دکمه ارسال */
        border: none;
        /* حذف حاشیه */
        color: white;
        /* رنگ متن دکمه */
        padding: 10px;
        /* فاصله داخلی */
        margin-top: 20px;
        /* فاصله بالای دکمه */
        border-radius: 5px;
        /* گوشه‌های گرد */
        cursor: pointer;
        /* نشانگر ماوس */
        transition: background-color 0.3s;
        /* انیمیشن تغییر رنگ */
    }

    .submit-btn:hover {
        background-color: #45a049;
        /* رنگ دکمه هنگام هاور */
    }
    .quiz-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }
    
    .questions-wrapper {
        max-height: calc(100vh - 200px);
        overflow-y: auto;
        padding: 15px;
        border: 1px solid #eee;
        border-radius: 8px;
        margin-bottom: 20px;
    }
    
    .question-item {
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid #f0f0f0;
    }
    
    .question-item:last-child {
        border-bottom: none;
        margin-bottom: 0;
    }
    
    .form-footer {
        position: sticky;
        bottom: 0;
        background: #3a3a3a;
        padding: 15px 0;
        text-align: center;
    }
    .submit-btn {
        /* استایل پایه */
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 28px;
        font-size: 18px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 50px;
        border: none;
        cursor: pointer;
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        
        /* گرادیانت زیبا */
        background: linear-gradient(135deg, rgb(255, 204, 0));
        color: white;
        
        /* افکت نور */
        &::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
    }

    .btn-text {
        transition: all 0.3s ease;
        display: inline-block;
        margin-right: 8px;
    }

    .btn-icon {
        transition: all 0.3s ease;
        opacity: 0;
        transform: translateX(-10px);
    }

    /* افکت hover */
    .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgb(255, 204, 0, 0.6);
        
        &::before {
            left: 100%;
        }
        
        .btn-icon {
            opacity: 1;
            transform: translateX(0);
        }
        
        .btn-text {
            transform: translateX(5px);
        }
    }

    /* افکت active (هنگام کلیک) */
    .submit-btn:active {
        transform: translateY(1px) scale(0.98);
        box-shadow: 0 2px 10px rgba(103, 114, 229, 0.8);
    }

    /* حالت فوکوس برای دسترسی بهتر */
    .submit-btn:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(103, 114, 229, 0.4);
    }
</style>

<body>
    <div class="quiz-container">

        <h1 class="mb-4">آزمون هوش چندگانه</h1>
        <form method="post" action="{% url 'intelligence_test:process_test' %}" class="quiz-form">
            {% csrf_token %}
            <div class="questions-wrapper">
            {% for field in form %}
            <div class="question-item">
                {{ field|as_crispy_field }}
            </div>
            {% endfor %}
            </div>
            <div class="form-footer">
                <button type="submit" class="submit-btn">
                    <span class="btn-text">ثبت آزمون</span>
                    <span class="btn-icon">✓</span>
                </button>
            </div>
        </form>
    </div>
</body>

</html>
